name: Apply D1 migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "원격 D1 마이그레이션을 적용하려면 APPLY를 입력하세요."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: List pending migrations
        run: >
          pnpm wrangler d1 migrations list
          campus-opinion-board-db
          --remote

      - name: Apply migrations
        run: pnpm db:migrate:remote

      - name: Verify remaining migrations
        run: >
          pnpm wrangler d1 migrations list
          campus-opinion-board-db
          --remote
